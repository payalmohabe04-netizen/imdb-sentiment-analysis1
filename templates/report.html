<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evaluation Report — IMDB Sentiment Analysis</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      min-height: 100vh;
      padding: 40px 16px;
    }

    .container { max-width: 900px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 40px; }
    header h1 { font-size: 1.9rem; font-weight: 700; color: #0f172a; }
    header p  { margin-top: 8px; color: #64748b; font-size: 0.95rem; }
    .back-link { display: inline-block; margin-top: 10px; color: #6366f1; text-decoration: none; font-size: 0.9rem; }
    .back-link:hover { text-decoration: underline; }

    /* Metric cards */
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }
    .metric-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }
    .metric-card .value {
      font-size: 2rem;
      font-weight: 700;
      color: #6366f1;
    }
    .metric-card .label {
      margin-top: 6px;
      font-size: 0.82rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Section */
    .section {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .section h2 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 16px;
      color: #0f172a;
      border-bottom: 2px solid #6366f1;
      padding-bottom: 8px;
    }

    /* Charts */
    .chart-img {
      width: 100%;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }

    /* Info table */
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid #e2e8f0; }
    th { background: #f1f5f9; font-weight: 600; color: #475569; }
    td:last-child { font-weight: 600; color: #1e293b; }

    /* Bar chart (metric bars) */
    .bar-list { list-style: none; }
    .bar-item { margin-bottom: 14px; }
    .bar-label { display: flex; justify-content: space-between; font-size: 0.88rem; margin-bottom: 4px; }
    .bar-track { height: 10px; background: #e2e8f0; border-radius: 99px; overflow: hidden; }
    .bar-fill  { height: 100%; border-radius: 99px; background: #6366f1; transition: width 1s ease; }

    /* Loading state */
    #loadingMsg { text-align: center; padding: 20px; color: #64748b; }

    footer {
      text-align: center;
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid #e2e8f0;
      font-size: 0.78rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
<div class="container">

  <header>
    <h1>📊 Evaluation Report</h1>
    <p>IMDB Sentiment Analysis · Logistic Regression + TF-IDF</p>
    <a class="back-link" href="/">← Back to Analyzer</a>
  </header>

  <div id="loadingMsg">Loading metrics…</div>

  <div id="reportContent" style="display:none">

    <!-- Metric cards -->
    <div class="metric-grid" id="metricGrid"></div>

    <!-- Metric bars -->
    <div class="section">
      <h2>Performance Metrics</h2>
      <ul class="bar-list" id="barList"></ul>
    </div>

    <!-- Charts -->
    <div class="section">
      <h2>Confusion Matrix & Sentiment Distribution</h2>
      <img class="chart-img" src="/static/evaluation_charts.png" alt="Evaluation Charts" />
    </div>

    <!-- Dataset info -->
    <div class="section">
      <h2>Dataset & Model Details</h2>
      <table id="infoTable"></table>
    </div>

  </div>

</div>

<footer>IMDB Sentiment Analysis Pipeline &nbsp;·&nbsp; Logistic Regression + TF-IDF</footer>

<script>
  async function loadReport() {
    try {
      const resp = await fetch("/metrics");
      const m = await resp.json();

      document.getElementById("loadingMsg").style.display = "none";
      document.getElementById("reportContent").style.display = "block";

      // Metric cards
      const cards = [
        { key: "accuracy",  label: "Accuracy"  },
        { key: "precision", label: "Precision" },
        { key: "recall",    label: "Recall"    },
        { key: "f1_score",  label: "F1-Score"  },
      ];
      const grid = document.getElementById("metricGrid");
      cards.forEach(c => {
        const pct = (m[c.key] * 100).toFixed(2) + "%";
        grid.innerHTML += `
          <div class="metric-card">
            <div class="value">${pct}</div>
            <div class="label">${c.label}</div>
          </div>`;
      });

      // Bar list
      const barList = document.getElementById("barList");
      cards.forEach(c => {
        const pct = (m[c.key] * 100).toFixed(2);
        barList.innerHTML += `
          <li class="bar-item">
            <div class="bar-label"><span>${c.label}</span><span>${pct}%</span></div>
            <div class="bar-track">
              <div class="bar-fill" style="width:${pct}%"></div>
            </div>
          </li>`;
      });

      // Info table
      const rows = [
        ["Total Samples",       m.total_samples?.toLocaleString() || "50,000"],
        ["Training Samples",    m.train_size?.toLocaleString()    || "40,000"],
        ["Testing Samples",     m.test_size?.toLocaleString()     || "10,000"],
        ["TF-IDF Vocabulary",   m.vocab_size?.toLocaleString()    || "N/A"],
        ["Classifier",          "Logistic Regression"],
        ["Vectorizer",          "TF-IDF (max_features=50,000, ngram=(1,2))"],
        ["Test Split",          "80% train / 20% test"],
        ["Positive Samples",    "25,000 (50%)"],
        ["Negative Samples",    "25,000 (50%)"],
      ];
      const table = document.getElementById("infoTable");
      table.innerHTML = `<tr><th>Parameter</th><th>Value</th></tr>` +
        rows.map(([k,v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("");
    } catch(e) {
      document.getElementById("loadingMsg").textContent = "Could not load metrics. Make sure the server is running.";
    }
  }

  loadReport();
</script>
</body>
</html>
