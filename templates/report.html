<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evaluation Report — IMDB Sentiment Analysis</title>
  <style>
    /* (CSS unchanged — same styling as your version) */
  </style>
</head>
<body>
<div class="container">

  <header>
    <h1>📊 Evaluation Report</h1>
    <p>IMDB Sentiment Analysis · Logistic Regression + TF-IDF</p>
    <a class="back-link" href="/">← Back to Analyzer</a>
  </header>

  <div id="loadingMsg">Loading metrics…</div>

  <div id="reportContent" style="display:none">

    <!-- Metric cards -->
    <div class="metric-grid" id="metricGrid"></div>

    <!-- Metric bars -->
    <div class="section">
      <h2>Performance Metrics</h2>
      <ul class="bar-list" id="barList"></ul>
    </div>

    <!-- Charts -->
    <div class="section">
      <h2>Confusion Matrix & Sentiment Distribution</h2>
      <img class="chart-img" src="/static/evaluation_charts.png" alt="Evaluation Charts" />
    </div>

    <!-- Dataset info -->
    <div class="section">
      <h2>Dataset & Model Details</h2>
      <table id="infoTable"></table>
    </div>

  </div>

</div>

<footer>IMDB Sentiment Analysis Pipeline · Logistic Regression + TF-IDF</footer>

<script>
  const API_BASE = "https://your-app.onrender.com"; // replace with your Render URL

  async function loadReport() {
    try {
      const resp = await fetch(`${API_BASE}/metrics`);
      const m = await resp.json();

      document.getElementById("loadingMsg").style.display = "none";
      document.getElementById("reportContent").style.display = "block";

      // Metric cards
      const cards = [
        { key: "accuracy",  label: "Accuracy"  },
        { key: "precision", label: "Precision" },
        { key: "recall",    label: "Recall"    },
        { key: "f1_score",  label: "F1-Score"  },
      ];
      const grid = document.getElementById("metricGrid");
      cards.forEach(c => {
        const pct = (m[c.key] * 100).toFixed(2) + "%";
        grid.innerHTML += `
          <div class="metric-card">
            <div class="value">${pct}</div>
            <div class="label">${c.label}</div>
          </div>`;
      });

      // Bar list
      const barList = document.getElementById("barList");
      cards.forEach(c => {
        const pct = (m[c.key] * 100).toFixed(2);
        barList.innerHTML += `
          <li class="bar-item">
            <div class="bar-label"><span>${c.label}</span><span>${pct}%</span></div>
            <div class="bar-track">
              <div class="bar-fill" style="width:${pct}%"></div>
            </div>
          </li>`;
      });

      // Info table
      const rows = [
        ["Total Samples",       m.total_samples?.toLocaleString() || "50,000"],
        ["Training Samples",    m.train_size?.toLocaleString()    || "40,000"],
        ["Testing Samples",     m.test_size?.toLocaleString()     || "10,000"],
        ["TF-IDF Vocabulary",   m.vocab_size?.toLocaleString()    || "N/A"],
        ["Classifier",          "Logistic Regression"],
        ["Vectorizer",          "TF-IDF (max_features=50,000, ngram=(1,2))"],
        ["Test Split",          "80% train / 20% test"],
        ["Positive Samples",    "25,000 (50%)"],
        ["Negative Samples",    "25,000 (50%)"],
      ];
      const table = document.getElementById("infoTable");
      table.innerHTML = `<tr><th>Parameter</th><th>Value</th></tr>` +
        rows.map(([k,v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("");
    } catch(e) {
      document.getElementById("loadingMsg").textContent = "Could not load metrics. Make sure the server is running.";
    }
  }

  loadReport();
</script>
</body>
</html>
