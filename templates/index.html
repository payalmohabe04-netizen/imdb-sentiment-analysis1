<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IMDB Sentiment Analyzer</title>
  <style>
    /* (same CSS as before, unchanged) */
  </style>
</head>
<body>

<header>
  <h1>🎬 IMDB Sentiment Analyzer</h1>
  <p>Powered by Logistic Regression + TF-IDF · Trained on 50,000 movie reviews</p>
  <a class="nav-link" href="/report">📊 View Evaluation Report</a>
</header>

<div class="card">
  <label for="reviewInput">Movie Review</label>
  <textarea id="reviewInput" placeholder="Paste or type a movie review here…"></textarea>

  <div class="examples">
    <h3>Quick Examples</h3>
    <span class="example-btn" onclick="setExample('positive')">👍 Positive sample</span>
    <span class="example-btn" onclick="setExample('negative')">👎 Negative sample</span>
  </div>

  <div class="btn-row">
    <button id="analyzeBtn" onclick="analyze()">Analyze Sentiment</button>
    <button id="clearBtn" onclick="clearAll()">Clear</button>
  </div>

  <div class="loader" id="loader">
    <span class="spinner"></span> Analyzing…
  </div>

  <div id="errorBox" style="display:none; margin-top:18px; padding:14px 16px; background:#450a0a; border:1px solid #ef4444; border-radius:8px; color:#fca5a5; font-size:0.9rem; line-height:1.5;"></div>

  <div id="result">
    <div class="emoji" id="emoji"></div>
    <div class="sentiment-label" id="sentimentLabel"></div>
    <div class="confidence" id="confidenceText"></div>
    <div class="conf-bar-wrap">
      <div class="conf-bar-fill" id="confBar"></div>
    </div>
  </div>
</div>

<footer>IMDB Sentiment Analysis Pipeline · Logistic Regression + TF-IDF</footer>

<script>
  const API_BASE = "https://your-app.onrender.com"; // replace with your Render URL

  const EXAMPLES = {
    positive: "This film was an absolute masterpiece! The performances were stunning and the story kept me engaged throughout.",
    negative: "What a complete waste of time. The plot made no sense, the acting was terrible, and I walked out after the first hour."
  };

  function setExample(type) {
    document.getElementById("reviewInput").value = EXAMPLES[type];
  }

  function showError(msg) {
    const box = document.getElementById("errorBox");
    box.textContent = "⚠ " + msg;
    box.style.display = "block";
    document.getElementById("result").style.display = "none";
  }

  async function analyze() {
    const review = document.getElementById("reviewInput").value.trim();
    if (!review) { alert("Please enter a review first."); return; }

    const btn = document.getElementById("analyzeBtn");
    const loader = document.getElementById("loader");
    const result = document.getElementById("result");
    const errorBox = document.getElementById("errorBox");

    btn.disabled = true;
    loader.style.display = "block";
    result.style.display = "none";
    errorBox.style.display = "none";

    try {
      const resp = await fetch(`${API_BASE}/predict`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ review })
      });

      let data;
      try {
        data = await resp.json();
      } catch {
        showError("Server returned an unexpected response (not JSON).");
        return;
      }

      if (!resp.ok || data.error) {
        showError(data.error || `Server error (HTTP ${resp.status})`);
        return;
      }

      const pct = Math.round(data.confidence * 100);
      result.className = data.sentiment;
      document.getElementById("emoji").textContent = data.sentiment === "positive" ? "😄" : "😞";
      document.getElementById("sentimentLabel").textContent = data.sentiment.toUpperCase();
      document.getElementById("confidenceText").textContent = `Confidence: ${pct}%`;
      document.getElementById("confBar").style.width = pct + "%";

      result.style.display = "block";
    } catch (e) {
      showError("Unexpected error: " + e.message);
    } finally {
      btn.disabled = false;
      loader.style.display = "none";
    }
  }

  function clearAll() {
    document.getElementById("reviewInput").value = "";
    document.getElementById("result").style.display = "none";
    document.getElementById("errorBox").style.display = "none";
  }

  document.getElementById("reviewInput").addEventListener("keydown", e => {
    if (e.ctrlKey && e.key === "Enter") analyze();
  });
</script>
</body>
</html>
